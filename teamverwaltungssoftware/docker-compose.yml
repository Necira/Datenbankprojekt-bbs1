version: '3.8'
services:
  mysql:
    image: mysql:8.0
    container_name: mysql-container
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: Datenbankprojekt_BBS1
    ports:
      - "3306:3306"
    volumes:
      - ./dump.sql:/docker-entrypoint-initdb.d/dump.sql

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: node-server
    ports:
      - "3000:3000"
    depends_on:
      - mysql

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: vue-app
    ports:
      - "8080:8080"
    depends_on:
      - backend