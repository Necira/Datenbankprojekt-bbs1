services:
    mysql:
        image: mysql:8.0
        container_name: mysql
        environment:
            MYSQL_ROOT_PASSWORD: root
            MYSQL_DATABASE: Datenbankprojekt-BBS1
        ports:
            - '3306:3306'
        volumes:
            - ./dump.sql:/docker-entrypoint-initdb.d/dump.sql
        networks:
            - app-network
        healthcheck:
            test: ['CMD', 'mysqladmin', 'ping', '-h', 'localhost', '-u', 'root', '-proot']
            interval: 5s
            retries: 10
            start_period: 10s
            timeout: 5s

    frontend:
        build:
            context: .
            dockerfile: Dockerfile.frontend
        container_name: frontend
        ports:
            - '8080:8080'
        depends_on:
            mysql:
                condition: service_healthy
        networks:
            - app-network

    backend:
        build:
            context: .
            dockerfile: Dockerfile.backend
        container_name: backend
        ports:
            - '3000:3000'
        depends_on:
            mysql:
                condition: service_healthy
        networks:
            - app-network

networks:
    app-network:
        driver: bridge
