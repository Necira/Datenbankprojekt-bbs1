services:
    mysql:
        image: mysql:8.0
        container_name: mysql
        environment:
            MYSQL_ROOT_PASSWORD: root
            MYSQL_DATABASE: Datenbankprojekt-BBS1
            MYSQL_ROOT_HOST: '%'
        ports:
            - '3306:3306'
        volumes:
            - ./dump.sql:/docker-entrypoint-initdb.d/dump.sql
        networks:
            - app-network
        healthcheck:
            test: ['CMD-SHELL', 'exit | mysql -h localhost -P 3306 -u root -p$$MYSQL_ROOT_PASSWORD']
            interval: 5s
            timeout: 20s
            retries: 30

    frontend:
        build:
            context: .
            dockerfile: Dockerfile.frontend
        container_name: frontend
        ports:
            - '8080:8080'
        depends_on:
            mysql:
                condition: service_healthy
        networks:
            - app-network

    backend:
        build:
            context: .
            dockerfile: Dockerfile.backend
        container_name: backend
        restart: always
        ports:
            - '3000:3000'
        depends_on:
            mysql:
                condition: service_healthy
        networks:
            - app-network

networks:
    app-network:
        driver: bridge
